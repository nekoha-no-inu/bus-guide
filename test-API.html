<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Seibu Bus Transit Test</title>
</head>
<body>
  <h2>西武バスの次のバスを検索（Directions API版）</h2>

  <select id="stopSelect">
    <option value="35.7791,139.5152">下清戸</option>
    <option value="35.7802,139.5160">台田</option>
    <option value="35.7739,139.5140">清瀬駅北口</option>
    <option value="35.7990,139.5630">新座駅南口</option>
  </select>

  <button onclick="searchBus()">検索</button>

  <pre id="result"></pre>

  <script>
    async function searchBus() {
      const [lat, lng] = document.getElementById("stopSelect").value.split(",");
      const origin = new google.maps.LatLng(Number(lat), Number(lng));
      const destination = new google.maps.LatLng(35.7739, 139.5140);

      const service = new google.maps.DirectionsService();

      const request = {
        origin,
        destination,
        travelMode: google.maps.TravelMode.TRANSIT,
        transitOptions: {
          modes: ["BUS"]
        },
        provideRouteAlternatives: false
      };

      service.route(request, (result, status) => {
        if (status === "OK") {
          document.getElementById("result").textContent =
            JSON.stringify(result, null, 2);
        } else {
          document.getElementById("result").textContent =
            "Error: " + status;
        }
      });
    }
  </script>

  <script async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCCQB3KoCaFIvG1Wf8xy7y03d1ACHjqpsU">
  </script>
</body>
</html>
