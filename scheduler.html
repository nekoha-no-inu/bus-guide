<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スケジューラー</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase -->
</head>

<body>
  <a href="home.html" class="menu-btn">← ホームに戻る</a>

  <div class="character-area">
    <div id="bubble" class="bubble">予定を読み込んでいるよ…</div>
    <img id="character" src="img/character_normal.png" class="character">
  </div>

  <div class="container">
    <h2>スケジューラー</h2>

    <div class="calendar-toolbar">
      <button id="prevMonthBtn" class="action-btn">◀ 前月</button>
      <h3 id="currentMonthLabel">年月</h3>
      <button id="nextMonthBtn" class="action-btn">次月 ▶</button>
    </div>

    <div id="calendarGrid" class="calendar-grid"></div>

    <div class="calendar-detail">
      <h3 id="selectedDateLabel">日付の予定</h3>
      <div id="selectedDateList"></div>
    </div>

    <div class="add-item">
      <input id="scheduleInput" type="text" placeholder="予定を入力">

      <div class="schedule-form-row">
        <input id="scheduleStartDate" type="date">
        <input id="scheduleEndDate" type="date">
      </div>

      <div class="schedule-form-row">
        <input id="scheduleTime" type="time">
        <label class="schedule-inline-option">
          <input id="allDayCheck" type="checkbox">
          終日
        </label>
      </div>

      <div class="schedule-form-row">
        <select id="schedulePerson">
          <option value="共通">共通</option>
          <option value="みき">みき</option>
          <option value="みほ">みほ</option>
        </select>
        <input id="scheduleGenre" list="genreOptions" placeholder="ジャンル">
      </div>

      <div class="add-buttons">
        <button id="addScheduleBtn" class="action-btn">予定の追加</button>
      </div>
    </div>

    <datalist id="genreOptions">
      <option value="仕事"></option>
      <option value="学校"></option>
      <option value="用事"></option>
      <option value="習い事"></option>
      <option value="イベント"></option>
      <option value="予定"></option>
    </datalist>

    <br>
    <a href="home.html" class="menu-btn">← ホームに戻る</a>
  </div>

    <!-- Firebase SDK (compat版 v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <!-- 共通ユーティリティ + Firebase 初期化 -->
  <script src="js/common.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/scheduler.js"></script>
</body>
</html>
