<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バス乗換案内</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<style>
  /* キャラ＋ルートカード 横並び */
  #guide {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin: 10px 0;
  }
  #routeCard {
    background: #fff;
    border: 2px solid #555;
    border-radius: 10px;
    padding: 12px 14px;
    line-height: 1.8;
    font-size: 14px;
    display: none;
    min-width: 170px;
  }
  /* 前/次ボタン */
  #navButtons {
    display: flex;
    gap: 10px;
    margin: 6px 0 12px;
  }
  #prevBtn, #nextBtn {
    flex: 1;
    padding: 10px;
    font-size: 15px;
    border-radius: 8px;
    border: 2px solid var(--primary, #4caf50);
    background: #fff;
    color: var(--primary, #4caf50);
    cursor: pointer;
    width: auto;
  }
  #prevBtn:disabled, #nextBtn:disabled {
    opacity: 0.3;
    cursor: default;
  }
  #routeDecisionLogButton {
    margin-top: 20px;
    padding: 10px 14px;
    width: auto;
    border: 1px solid #777;
    border-radius: 6px;
    background: #f5f5f5;
    color: #333;
    cursor: pointer;
  }
  #routeDecisionLogPanel {
    margin-top: 10px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fafafa;
  }
  #routeDecisionLogPanel h2 { margin: 0 0 8px; font-size: 16px; }
  #routeDecisionLogOutput {
    max-height: 360px;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: 12px/1.5 Consolas, monospace;
  }
  .departure-datetime-control {
    display: flex;
    align-items: stretch;
    gap: 8px;
    width: 100%;
    margin: 5px 0;
  }
  #datetimeManual {
    flex: 1;
    min-width: 0;
    box-sizing: border-box;
    height: 42px;
    margin: 0;
    padding: 10px;
    border: 1px solid var(--border-color, #333);
    border-radius: 8px;
    background: #fff;
    color: #222;
    font-size: 16px;
  }
  #datetimePickerBtn {
    flex: 0 0 auto;
    width: auto;
    min-width: 96px;
    margin: 0;
    padding: 8px 10px;
    border: 1px solid #4a90e2;
    border-radius: 8px;
    background: #fff;
    color: #357ac8;
    font-size: 14px;
    cursor: pointer;
  }
  .departure-datetime-control:focus-within #datetimeManual {
    outline: 2px solid #4caf50;
    outline-offset: 1px;
  }
  #datetimePicker {
    position: fixed;
    left: -10000px;
    top: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  #timetableDayButtons {
    display: flex;
    gap: 8px;
    margin: 10px 0;
  }
  #timetableDayButtons button {
    flex: 1;
    width: auto;
    margin: 0;
    padding: 9px 6px;
    border: 1px solid #4a90e2;
    border-radius: 6px;
    background: #fff;
    color: #357ac8;
    font-size: 14px;
    cursor: pointer;
  }
  #timetableDayButtons button.active {
    background: #4a90e2;
    color: #fff;
  }
</style>
</head>
<body>

<a href="home.html" class="menu-btn">← ホームに戻る</a>

<!-- キャラ＋ルートカード -->
<div id="guide">
  <div class="character-area">
    <div id="bubble" class="bubble">…</div>
    <img id="character" src="img/character_normal.png" class="character">
  </div>
  <div id="routeCard"></div>
</div>

<!-- 前/次ボタン（上部） -->
<div id="navButtons">
  <button id="prevBtn" disabled>◀ 前のバス</button>
  <button id="nextBtn" disabled>次のバス ▶</button>
</div>

<!-- 検索フォーム -->
<div id="controls">
  <label>出発日時：
    <span class="departure-datetime-control">
      <input type="text" id="datetimeManual" aria-label="出発日時" inputmode="text" autocomplete="off" placeholder="yyyy/mm/dd HH:mm" maxlength="16">
      <button type="button" id="datetimePickerBtn" aria-label="カレンダーから日時を選択">日時を選択</button>
      <input type="datetime-local" id="datetime" tabindex="-1" aria-hidden="true">
    </span>
  </label>
  <button id="nowButton">現在時刻に更新</button>

  <div id="modeButtons">
    <button data-mode="自宅→清瀬駅" class="active">自宅→清瀬駅</button>
    <button data-mode="自宅→新座駅">自宅→新座駅</button>
    <button data-mode="清瀬駅→自宅">清瀬駅→自宅</button>
    <button data-mode="新座駅→自宅">新座駅→自宅</button>
  </div>

  <div id="timetableDayButtons" role="group" aria-label="使用する曜日ダイヤ">
    <button type="button" data-day-type="平日" aria-pressed="false">平日</button>
    <button type="button" data-day-type="土曜" aria-pressed="false">土曜日</button>
    <button type="button" data-day-type="休日" aria-pressed="false">休日</button>
  </div>

  <button id="searchBtn">🔍 検索</button>
</div>

<div id="dayTypeDisplay"></div>

<!-- 系統グループカード -->
<div id="groupCards"></div>

<button type="button" id="routeDecisionLogButton" aria-expanded="false" aria-controls="routeDecisionLogPanel">ルート決定ログを表示</button>
<section id="routeDecisionLogPanel" hidden aria-labelledby="routeDecisionLogTitle">
  <h2 id="routeDecisionLogTitle">ルート決定ログ</h2>
  <pre id="routeDecisionLogOutput">検索すると、ルート選択の過程がここに表示されます。</pre>
</section>

<script src="js/common.js"></script>
<script src="js/transfer.js?v=d797ae1"></script>
</body>
</html>
