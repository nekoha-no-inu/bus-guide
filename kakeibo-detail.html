<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家計簿 明細</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<style>
#filterRow { display:flex; gap:8px; margin:8px 0; flex-wrap:wrap; }
#filterRow select,
#filterRow input[type="month"] { flex:1; min-width:80px; font-size:13px; padding:6px; }
.filter-btn { padding:6px 14px; background:#4caf50; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:13px; white-space:nowrap; width:auto; }
#inlineInputToggleRow { margin:6px 0 10px; font-size:13px; color:#444; }
#inlineInputToggleRow label { display:flex; align-items:center; gap:6px; cursor:pointer; }
.detail-layout { display:block; }
.detail-list-pane { min-width:0; }
.detail-input-pane { display:none; }
.detail-layout.split { display:grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr); gap:12px; align-items:start; }
.detail-layout.split .detail-input-pane { display:block; position:sticky; top:8px; }
.inline-input-card { background:#fff; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); padding:12px; }
.inline-input-card h3 { margin:0 0 10px; font-size:15px; }
.inline-input-card label { display:block; margin-top:8px; font-size:13px; color:#444; }
.inline-input-card input,
.inline-input-card select { width:100%; box-sizing:border-box; margin-top:3px; padding:8px; border-radius:6px; border:1px solid #ccc; font-size:14px; }
.inline-input-btns { display:flex; gap:8px; margin-top:10px; }
.inline-input-btns button { flex:1; width:auto; border:none; border-radius:8px; padding:10px; font-size:14px; cursor:pointer; }
.inline-input-btns .submit { background:#4caf50; color:#fff; }
.inline-input-btns .clear { background:#999; color:#fff; }
.detail-total { background:#fff; border-radius:8px; padding:10px 12px; margin:8px 0; box-shadow:0 1px 3px rgba(0,0,0,.08); font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
.detail-total span { font-size:14px; }
.detail-item { background:#fff; border-radius:8px; margin:6px 0; padding:10px 12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.detail-top  { display:flex; justify-content:space-between; align-items:flex-start; }
.detail-date { font-size:12px; color:#888; }
.detail-desc { font-size:15px; font-weight:500; margin:2px 0; }
.detail-meta { font-size:12px; color:#777; }
.detail-right { display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0; }
.detail-amount { font-size:16px; font-weight:bold; }
.detail-amount.expense { color:#e74c3c; }
.detail-amount.income  { color:#2196F3; }
.edit-btn { padding:3px 10px; font-size:12px; border-radius:6px; border:1px solid #4caf50; color:#4caf50; background:#fff; cursor:pointer; width:auto; }

/* モーダル */
#modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; overflow-y:auto; }
#modal { background:#fff; border-radius:12px; padding:18px; margin:40px auto 40px; max-width:360px; }
#modal label { display:block; margin-top:10px; font-size:14px; }
#modal input,
#modal select { width:100%; padding:8px; font-size:14px; box-sizing:border-box; border-radius:6px; border:1px solid #ccc; margin-top:2px; }
.modal-btns { display:flex; gap:8px; margin-top:14px; }
.modal-btns button { flex:1; padding:10px; border-radius:8px; font-size:14px; cursor:pointer; border:none; width:auto; }
.btn-save   { background:#4caf50; color:#fff; }
.btn-delete { background:#e74c3c; color:#fff; }
.btn-cancel { background:#999;    color:#fff; }
#loading { text-align:center; color:#999; padding:20px; }
@media (max-width: 980px) {
  .detail-layout.split { grid-template-columns: 1fr; }
  .detail-layout.split .detail-input-pane { position:static; }
}
</style>
</head>
<body>

<a href="kakeibo.html" class="menu-btn">← 家計簿に戻る</a>

<div class="character-area">
  <div id="bubble" class="bubble">明細を確認しよう！</div>
  <img id="character" src="img/character_normal.png" class="character">
</div>

<div id="filterRow">
  <input type="month" id="f-month">

  <select id="f-type">
    <option value="">全種別</option>
    <option value="支出">支出</option>
    <option value="収入">収入</option>
  </select>

  <select id="f-person">
    <option value="">全員</option>
    <option value="みき">みき</option>
    <option value="みほ">みほ</option>
  </select>

  <!-- ▼▼ 追加：大項目 ▼▼ -->
  <select id="f-category">
    <option value="">全大項目</option>
    <option>固定費</option>
    <option>変動費</option>
    <option>臨時出費</option>
    <option>旅費</option>
    <option>給与</option>
    <option>臨時収入</option>
  </select>

  <!-- ▼▼ 追加：小項目 ▼▼ -->
  <select id="f-subcategory">
    <option value="">全小項目</option>
  </select>

  <button id="filterBtn" class="filter-btn">絞り込み</button>
</div>

<div id="inlineInputToggleRow">
  <label><input type="checkbox" id="detailInlineInputToggle"> この画面で入力する</label>
</div>

<div id="detailLayout" class="detail-layout">
  <div class="detail-list-pane">
    <div id="detailTotal" class="detail-total">合計：0円</div>
    <div id="list"><div id="loading">読み込み中…</div></div>
  </div>

  <aside id="detailInputPane" class="detail-input-pane">
    <div class="inline-input-card">
      <h3>この画面で入力</h3>

      <label>日付</label>
      <input type="date" id="d-date">

      <label>種別</label>
      <select id="d-type">
        <option value="支出">支出</option>
        <option value="収入">収入</option>
      </select>

      <label>大項目</label>
      <select id="d-category"></select>

      <div id="d-subcategory-block">
        <label>小項目</label>
        <select id="d-subcategory"></select>
      </div>

      <label>内容</label>
      <input type="text" id="d-description" placeholder="例：BigA、社食など">

      <label>金額（円）</label>
      <input type="number" id="d-amount" min="0" placeholder="例：1200">

      <label>出した人</label>
      <select id="d-person">
        <option value="みき">みき</option>
        <option value="みほ">みほ</option>
      </select>

      <div class="inline-input-btns">
        <button id="d-submitBtn" class="submit">✅ 追加</button>
        <button id="d-clearBtn" class="clear" type="button">クリア</button>
      </div>
    </div>
  </aside>
</div>

<!-- 編集モーダル -->
<div id="modal-overlay">
  <div id="modal">
    <h3 style="margin:0 0 10px;font-size:16px;">明細を編集</h3>
    <label>日付</label><input type="date" id="m-date">
    <label>種別</label>
    <select id="m-type">
      <option value="支出">支出</option>
      <option value="収入">収入</option>
    </select>
    <label>大項目</label>
    <select id="m-category">
      <option>固定費</option><option>変動費</option><option>臨時出費</option>
      <option>旅費</option><option>給与</option><option>臨時収入</option>
    </select>
    <label>小項目</label><input type="text" id="m-subcategory">
    <label>内容</label><input type="text" id="m-description">
    <label>金額（円）</label><input type="number" id="m-amount">
    <label>出した人</label>
    <select id="m-person">
      <option value="みき">みき</option>
      <option value="みほ">みほ</option>
    </select>
    <div class="modal-btns">
      <button id="saveEditBtn" class="btn-save">💾 保存</button>
      <button id="confirmDeleteBtn" class="btn-delete">🗑 削除</button>
      <button id="closeModalBtn" class="btn-cancel">キャンセル</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/common.js"></script>
<script src="js/firebase.js"></script>
<script src="js/kakeibo.js"></script>
</body>
</html>
